<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유한회사 재흠</title>
    <!-- 구글 Comfortaa 폰트 불러오기 링크 -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* 웹사이트 전체 레이아웃 스타일 */
        body {
            max-width: 600px;       /* 본문 최대 폭 제한 */
            margin: 50px auto;      /* 상하 여백, 좌우 중앙 정렬 */
            text-align: center;     /* 기본 텍스트 중앙 정렬 */
            padding: 0 20px;        /* 모바일 양옆 안전 여백 */
            background-color: #121212; /* 검은색 배경 */
            color: #ffffff;         /* 흰색 글자 */
            font-family: 'Comfortaa', 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        /* JAEHUM LLC 텍스트 로고 스타일 */
        .logo-container {
            color: #4caf50;         /* [수정] 사라졌던 로고의 선명한 초록색을 다시 추가했습니다 */
            margin: 40px 0 25px 0;  /* 위아래 여백 */
            line-height: 1.1;       /* 상하 글자 간격 좁힘 */
        }
        .logo-main {
            font-size: 36px;        /* JAEHUM 크기 */
            font-weight: 300;       /* 두껍게 */
            letter-spacing: -4px;   /* 자간 좁힘 */
        }
        .logo-sub {
            display: block;         /* 아래로 줄바꿈 */
            font-size: 14px;        /* LLC 크기 */
            font-weight: 400;       /* 기본 두께 */
            letter-spacing: 4px;    /* 너비 밸런스를 위한 자간 넓힘 */
            margin-top: 0px;        /* 위 글자와의 간격 */
        }

        /* 구분선 스타일 */
        hr {
            border: 0;
            border-top: 1px solid #333333; /* 연한 회색 선 */
            margin: 20px 0;
        }

        /* 링크 리스트 스타일 */
        ul {
            list-style: none;       /* 점(불릿) 제거 */
            padding: 0;             /* 왼쪽 기본 여백 제거 */
            display: inline-block;  /* 리스트 자체를 가운데로 정렬 */
            text-align: left;       /* 글자는 왼쪽 정렬로 가독성 유지 */
        }
        li {
            margin: 15px 0;         /* 링크 간의 위아래 간격 */
        }
        
        /* 링크 색상 및 데코레이션 */
        a {
            color: #ffffff;         /* 링크 색상 흰색 */
            text-decoration: none;  /* 밑줄 제거 */
        }
        a:hover {
            color: #81c784;         /* 마우스 올렸을 때 연초록색 */
            text-decoration: underline; /* 마우스 올렸을 때만 밑줄 */
        }

        /* 하단 저작권 문구 색상 */
        small {
            color: #aaaaaa;         /* 톤다운된 회색 */
        }
    </style>
</head>
<body>

    <!-- JAEHUM LLC 텍스트 로고 -->
    <div class="logo-container">
        <span class="logo-main">JAEHUM</span>
        <span class="logo-sub">LLC</span>
    </div>
    
    <hr>

    </ul>

    <hr>
    
    <!-- 하단 저작권 표시 -->
    <small>© 2026 JAEHUM LLC. All rights reserved.</small>

</body>
</html>

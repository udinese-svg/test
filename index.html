<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유한회사 재흠</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            background: #121212;
            color: #fff;
            text-align: center;
            font-family: 'Comfortaa', 'Malgun Gothic', sans-serif;
        }

        .logo {
            margin: 40px 0 25px;
            color: #4caf50;
            line-height: 1.1;
        }

        .logo-main {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -4px;
        }

        .logo-sub {
            display: block;
            font-size: 14px;
            letter-spacing: 4px;
        }

        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #333;
        }

        ul {
            display: inline-block;
            margin: 0;
            padding: 0;
            text-align: left;
            list-style: none;
        }

        li {
            margin: 15px 0;
        }

        a {
            color: #fff;
            text-decoration: none;
        }

        a:hover {
            color: #81c784;
            text-decoration: underline;
        }

        .portfolio-title {
            margin-top: 25px;
            text-align: center;
        }

        table {
            width: auto;
            margin: 10px auto 0;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            padding: 4px 12px;
            border: 1px solid #333;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #4caf50;
            color: #fff;
            font-weight: 400;
        }

        td {
            color: #ccc;
        }

        small {
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="logo">
        <span class="logo-main">JAEHUM</span>
        <span class="logo-sub">LLC</span>
    </div>

    <hr>

    <ul>
        <li>
            <a href="https://raw.githubusercontent.com/udinese-svg/test/main/2025-financial-statements.pdf" target="_blank">
                2025년 연간 결산자료 (PDF 다운로드)
            </a>
        </li>

        <li>
            <a href="https://raw.githubusercontent.com/udinese-svg/test/main/26H1-financial-statements.pdf" target="_blank">
                2026년 반기 가결산자료 (PDF 다운로드)
            </a>
        </li>
    </ul>

    <div class="portfolio-title">
        분기별 포트폴리오
    </div>

    <table>
        <tr>
            <th>기준일</th>
            <th>보유종목</th>
            <th>금액($)</th>
            <th>비중(%)</th>
        </tr>
        <tr>
            <td>2026. 9. 30.</td>
            <td>BOXX</td>
            <td>845,953.83</td>
            <td>100.0</td>
        </tr>
    </table>

    <hr>

    <small>© 2026 JAEHUM LLC. All rights reserved.</small>

</body>

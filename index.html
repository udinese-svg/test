
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유한회사 재흠</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            background: #F7F7F5;
            color: #333333;
            text-align: center;
            font-family: 'Comfortaa', 'Malgun Gothic', sans-serif;
        }

        .logo {
            margin: 40px 0 25px;
            color: #4caf50;
            line-height: 1.1;
        }

        .logo-main {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -4px;
        }

        .logo-sub {
            display: block;
            font-size: 14px;
            letter-spacing: 4px;
        }

        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #ddddda;
        }

        ul {
            display: inline-block;
            margin: 20px 0;
            padding: 0;
            text-align: left;
            list-style: none;
        }

        li {
            margin: 25px 0;
        }

        a {
            color: #333333;
            text-decoration: none;
            font-size: 16px;
        }

        a:hover {
            color: #388e3c;
            text-decoration: underline;
        }

        footer {
            margin-top: 25px;
            color: #888888;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="logo">
        <span class="logo-main">JAEHUM</span>
        <span class="logo-sub">LLC</span>
    </div>

    <hr>

    <ul>
        <li>
            <a href="https://udinese-svg.github.io/test/2025-financial-statements.pdf"
               target="_blank"
               rel="noopener noreferrer">

            </a>
        </li>

        <li>
            <a href="https://udinese-svg.github.io/test/26H1-financial-statements.pdf"
               target="_blank"
               rel="noopener noreferrer">
                2026년 반기 가결산자료 (PDF)
            </a>
        </li>
    </ul>

    <hr>

    <footer>
        © 2026 JAEHUM LLC. All rights reserved.
    </footer>

</html>

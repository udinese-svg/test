
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유한회사 재흠</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 25px;
            background: #F7F7F5;
            color: #333333;
            font-family: 'Comfortaa', 'Malgun Gothic', sans-serif;
        }

        /* 상단 로고 */
        .logo {
            margin: 40px 0 25px;
            color: #4caf50;
            line-height: 1.1;
            text-align: center;
        }

        .logo-main {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -4px;
        }

        .logo-sub {
            display: block;
            font-size: 14px;
            letter-spacing: 4px;
        }

        hr {
            margin: 25px 0;
            border: 0;
            border-top: 1px solid #ddddda;
        }

        /* 하단 좌우 레이아웃 */
        .content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            min-height: 500px;
            padding: 15px 0 30px;
        }

        /* 왼쪽 메뉴 */
        .menu {
            flex: 1;
            text-align: center;
        }

        ul {
            display: inline-block;
            margin: 0;
            padding: 0;
            text-align: left;
            list-style: none;
        }

        li {
            margin: 25px 0;
        }

        a {
            color: #333333;
            text-decoration: none;
            font-size: 16px;
        }

        a:hover {
            color: #388e3c;
            text-decoration: underline;
        }

        /* 중앙 세로 구분선 */
        .vertical-line {
            align-self: stretch;
            width: 1px;
            background: #ddddda;
        }

        /* 오른쪽 이미지 */
        .poster {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .poster img {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            object-fit: contain;
        }

        /* 하단 저작권 */
        footer {
            margin: 25px 0;
            color: #888888;
            text-align: center;
            font-size: 12px;
        }

        /* 모바일 대응 */
        @media (max-width: 650px) {
            body {
                margin: 25px auto;
                padding: 0 20px;
            }

            .content {
                flex-direction: column;
                gap: 25px;
            }

            .vertical-line {
                width: 100%;
                height: 1px;
                align-self: auto;
            }

            .menu {
                width: 100%;
                padding: 20px 0;
            }

            .poster {
                width: 100%;
            }

            .poster img {
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <!-- 상단 로고 -->
    <div class="logo">
        <span class="logo-main">JAEHUM</span>
        <span class="logo-sub">LLC</span>
    </div>

    <hr>

    <!-- 하단 좌우 영역 -->
    <div class="content">

        <!-- 왼쪽 PDF 메뉴 -->
        <section class="menu">
            <ul>
                <li>
                    <a href="https://udinese-svg.github.io/test/2025-financial-statements.pdf"
                       target="_blank"
                       rel="noopener noreferrer">
                        2025년 연간 결산자료 (PDF)
                    </a>
                </li>

                <li>
                    <a href="https://udinese-svg.github.io/test/26H1-financial-statements.pdf"
                       target="_blank"
                       rel="noopener noreferrer">
                        2026년 반기 가결산자료 (PDF)
                    </a>
                </li>
            </ul>
        </section>

        <!-- 중앙 세로 구분선 -->
        <div class="vertical-line"></div>

        <!-- 오른쪽 SPYM 이미지 -->
        <section class="poster">
            <img
                src="https://udinese-svg.github.io/test/spym-poster.png"
                alt="SPYM SPDR Portfolio S&P 500 ETF"
            >
        </section>

    </div>

    <hr>

    <footer>
        © 2026 JAEHUM LLC. All rights reserved.
    </footer>

</body>
</html>
